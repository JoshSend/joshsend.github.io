    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close modal">&times;</button>
        <button class="lightbox-arrow prev" id="prevBtn" aria-label="Previous image">&#10094;</button>
        <button class="lightbox-arrow next" id="nextBtn" aria-label="Next image">&#10095;</button>

        <div class="lightbox-content">
            <div class="image-wrapper">
                <img id="lightboxImg" src="" alt="">
            </div>
            <p id="lightboxCaption" class="lightbox-caption"></p>
        </div>

        <div class="lightbox-thumbnails" id="lightboxThumbnails"></div>
    </div>

    <!--%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%-->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gridItems = Array.from(document.querySelectorAll('.grid-item'));
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxCaption = document.getElementById('lightboxCaption');
            const lightboxClose = document.getElementById('lightboxClose');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');
            const thumbnailsContainer = document.getElementById('lightboxThumbnails');

            let currentIndex = 0;

            gridItems.forEach((item, index) => {
                const img = item.querySelector('img');
                const thumb = document.createElement('img');
                thumb.src = img.src;
                thumb.alt = img.alt;
                thumb.classList.add('thumb');
                thumb.addEventListener('click', () => openLightbox(index));
                thumbnailsContainer.appendChild(thumb);

                item.addEventListener('click', () => openLightbox(index));
            });

            function openLightbox(index) {
                currentIndex = index;
                updateLightbox();
                lightbox.classList.add('active');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            function updateLightbox() {
                const currentImg = gridItems[currentIndex].querySelector('img');
                lightboxImg.src = currentImg.src;
                lightboxImg.alt = currentImg.alt;
                lightboxCaption.textContent = currentImg.dataset.caption || '';

                const thumbs = thumbnailsContainer.querySelectorAll('.thumb');
                thumbs.forEach((t, i) => {
                    t.classList.toggle('active', i === currentIndex);
                });
            }

            function nextImage() {
                currentIndex = (currentIndex + 1) % gridItems.length;
                updateLightbox();
            }

            function prevImage() {
                currentIndex = (currentIndex - 1 + gridItems.length) % gridItems.length;
                updateLightbox();
            }

            nextBtn.addEventListener('click', (e) => { e.stopPropagation(); nextImage(); });
            prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prevImage(); });
            lightboxClose.addEventListener('click', closeLightbox);
            
            lightbox.addEventListener('click', (e) => {
                if (e.target === lightbox || e.target.classList.contains('lightbox-content')) {
                    closeLightbox();
                }
            });

            document.addEventListener('keydown', (e) => {
                if (!lightbox.classList.contains('active')) return;
                if (e.key === 'Escape') closeLightbox();
                if (e.key === 'ArrowRight') nextImage();
                if (e.key === 'ArrowLeft') prevImage();
            });
        });
    </script>
